<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Translation Test</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f5f5f5;
    color: #222;
  }
  h1 {
    font-size: 20px;
  }
  textarea {
    width: 100%;
    height: 80px;
    font-size: 15px;
    padding: 8px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    resize: vertical;
  }
  select, button {
    font-size: 15px;
    padding: 8px 12px;
    margin-top: 10px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
  button:disabled {
    background: #93b4f0;
    cursor: default;
  }
  pre {
    background: #111;
    color: #7fdb7f;
    padding: 12px;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 40px;
  }
</style>
</head>
<body>

  <h1>Translation test</h1>

  <textarea id="sentence" placeholder="Type a sentence to translate...">Hello, how are you?</textarea>

  <div>
    <select id="tgt_lang">
      <option value="uk">Ukrainian</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="ru">Russian</option>
      <option value="es">Spanish</option>
    </select>
    <button id="submit">Translate</button>
  </div>

  <h3>Raw JSON response</h3>
  <pre id="output">(nothing yet)</pre>

<script>
  const button = document.getElementById("submit");
  const output = document.getElementById("output");

  button.addEventListener("click", async () => {
    const sentence = document.getElementById("sentence").value;
    const tgt_lang = document.getElementById("tgt_lang").value;

    button.disabled = true;
    button.textContent = "Translating...";
    output.textContent = "...";

    try {
      const response = await fetch(`/translate?tgt_lang=${encodeURIComponent(tgt_lang)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify([sentence]),
      });

      // Show the response exactly as raw text, not parsed/pretty-printed,
      // so you see exactly what the API sent back (including \u escapes).
      const rawText = await response.text();
      output.textContent = rawText;
    } catch (err) {
      output.textContent = "Request failed: " + err;
    } finally {
      button.disabled = false;
      button.textContent = "Translate";
    }
  });
</script>

</body>
</html>
